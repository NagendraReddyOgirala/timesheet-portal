<script>
/* ================================================================
   CONFIGURATION — fusionaix Timesheet Portal
   ================================================================ */
const SP_SITE  = 'https://fusionaix.sharepoint.com/sites/TimesheetPortal';
const L_EMP    = 'Employees';
const L_TS     = 'Timesheets';
const L_ENT    = 'TimesheetEntries';
const HR_EMAIL = 'hr@fusionaix.com';
const CLIENT_ID = 'dd40aada-2cb8-4161-a7a3-54a917492adf';
const TENANT_ID = 'e00abbbd-d9e5-4abd-8e66-3c7e88ea3032';
const REDIRECT_URI = 'https://nagendrareddyogirala.github.io/timesheet-portal/';
const SCOPES = [
  'https://fusionaix.sharepoint.com/AllSites.Read',
  'https://fusionaix.sharepoint.com/AllSites.Write'
];

/* ================================================================
   MSAL SETUP — runs after msal-browser.min.js is loaded
   ================================================================ */
// msalConfig built inside startWhenReady() to avoid msal.LogLevel at parse time
let msalConfig;

let msalApp; // initialized in startWhenReady() after MSAL loads

async function getToken() {
  const accounts = msalApp.getAllAccounts();
  if (!accounts.length) throw new Error('No logged-in account found');
  try {
    const result = await msalApp.acquireTokenSilent({ scopes: SCOPES, account: accounts[0] });
    return result.accessToken;
  } catch(e) {
    console.warn('[App] Silent token failed, trying popup:', e.message);
    try {
      const result = await msalApp.acquireTokenPopup({ scopes: SCOPES, account: accounts[0] });
      return result.accessToken;
    } catch(popupErr) {
      throw new Error('Could not get token: ' + popupErr.message);
    }
  }
}

/* ================================================================
   SHAREPOINT REST API
   ================================================================ */
async function spGET(path) {
  const token = await getToken();
  const res   = await fetch(SP_SITE + '/_api/' + path, {
    headers: {
      'Accept':        'application/json;odata=nometadata',
      'Authorization': 'Bearer ' + token
    }
  });
  console.log('SP GET', path, '→', res.status);
  if (res.status === 401) throw new Error('Unauthorized — check API permissions in Azure AD');
  if (res.status === 403) throw new Error('Forbidden (403) — admin consent may be missing');
  if (!res.ok) { const t = await res.text(); throw new Error('SP error ' + res.status + ': ' + t.slice(0,150)); }
  return res.json();
}

async function spPOST(listName, body) {
  const token  = await getToken();
  const digest = await getDigest(token);
  const res    = await fetch(SP_SITE + "/_api/web/lists/getbytitle('" + listName + "')/items", {
    method: 'POST',
    headers: {
      'Accept':          'application/json;odata=nometadata',
      'Content-Type':    'application/json;odata=nometadata',
      'Authorization':   'Bearer ' + token,
      'X-RequestDigest': digest
    },
    body: JSON.stringify(body)
  });
  if (!res.ok) { const t = await res.text(); throw new Error('SP POST error ' + res.status + ': ' + t.slice(0,150)); }
  return res.json();
}

async function spPATCH(listName, itemId, body) {
  const token  = await getToken();
  const digest = await getDigest(token);
  const res    = await fetch(SP_SITE + "/_api/web/lists/getbytitle('" + listName + "')/items(" + itemId + ')', {
    method: 'POST',
    headers: {
      'Accept':          'application/json;odata=nometadata',
      'Content-Type':    'application/json;odata=nometadata',
      'Authorization':   'Bearer ' + token,
      'X-RequestDigest': digest,
      'IF-MATCH':        '*',
      'X-HTTP-Method':   'MERGE'
    },
    body: JSON.stringify(body)
  });
  if (!res.ok && res.status !== 204) { const t = await res.text(); throw new Error('SP PATCH error ' + res.status + ': ' + t.slice(0,150)); }
  return true;
}

let _digest = null;
async function getDigest(token) {
  if (_digest) return _digest;
  const res = await fetch(SP_SITE + '/_api/contextinfo', {
    method: 'POST',
    headers: { 'Accept': 'application/json;odata=nometadata', 'Authorization': 'Bearer ' + token }
  });
  const d = await res.json();
  _digest = d.FormDigestValue;
  setTimeout(() => { _digest = null; }, 25 * 60 * 1000);
  return _digest;
}

/* ================================================================
   STATE
   ================================================================ */
const TODAY  = new Date();
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MS     = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DL     = ['S','M','T','W','T','F','S'];
let anchor   = new Date();
let cView    = 'week';
let me       = null;
let emps     = [];
let statuses = {};
const H      = {};
const timers = {};

/* ================================================================
   DATA LOADING
   ================================================================ */
async function loadMe() {
  setMsg('Getting your account...');
  const accounts = msalApp.getAllAccounts();
  if (accounts.length > 0) {
    const a     = accounts[0];
    const email = (a.username || '').toLowerCase().trim();
    const name  = a.name || a.username || 'Unknown';
    const parts = name.split(' ');
    return { email, name, initials: ((parts[0]?.[0]||'')+(parts[parts.length-1]?.[0]||'')).toUpperCase(), isHR: email===HR_EMAIL.toLowerCase() };
  }
  const d     = await spGET('web/currentuser');
  const email = (d.Email||'').toLowerCase().trim();
  const name  = d.Title||'Unknown';
  const parts = name.split(' ');
  return { email, name, initials: ((parts[0]?.[0]||'')+(parts[parts.length-1]?.[0]||'')).toUpperCase(), isHR: email===HR_EMAIL.toLowerCase() };
}

async function loadEmps() {
  setMsg('Loading employees...');
  const d = await spGET("web/lists/getbytitle('" + L_EMP + "')/items?$filter=IsActive eq 1&$top=500");
  return (d.value||[]).map(e => {
    // Try all possible internal names for email column
    const email = (e.EmployeeEmail0 || e.EmployeeEmail || e.Email || '').toLowerCase().trim();
    // Try all possible internal names for EmpID column  
    const empId = e.EmpID || e.EmployeeID || ('EMP'+String(e.ID).padStart(3,'0'));
    console.log('[Emp]', e.Title, '| email field:', email, '| raw:', JSON.stringify(Object.keys(e)));
    const name = e.FullName0 || e.FullName || e.Title || 'Unknown';
    return { spId:e.ID, id:empId, name:name, email:email, dept:e.Department||'' };
  });
}

async function loadStatuses(weekStart) {
  setMsg('Loading timesheet status...');
  const iso = toISO(weekStart);
  const d   = await spGET("web/lists/getbytitle('" + L_TS + "')/items?$filter=WeekStartDate eq datetime'" + iso + "T00:00:00Z'&$top=500");
  const map = {};
  (d.value||[]).forEach(r => { map[(r.EmployeeEmail0||r.EmployeeEmail||r.Email||'').toLowerCase().trim()] = { spItemId:r.ID, status:r.Status||'Draft', totalHours:r.TotalHours||0, rejectionReason:r.RejectionReason||'' }; });
  return map;
}

async function loadEntries(ws, we) {
  setMsg('Loading hours...');
  const d = await spGET("web/lists/getbytitle('" + L_ENT + "')/items?$filter=EntryDate ge datetime'" + toISO(ws) + "T00:00:00Z' and EntryDate le datetime'" + toISO(we) + "T23:59:59Z'&$top=5000");
  (d.value||[]).forEach(r => {
    const ei = emps.findIndex(x => x.email === (r.EmployeeEmail0||r.EmployeeEmail||r.Email||'').toLowerCase().trim());
    if (ei < 0) return;
    const dt = new Date(r.EntryDate);
    H[hk(ei,dt)] = { value: r.Hours||0, spId: r.ID };
  });
}

async function saveEntry(ei, date, hours) {
  const k   = hk(ei, date);
  const emp = emps[ei];
  const ex  = H[k];
  const dISO = toISO(date) + 'T00:00:00Z';
  if (ex && ex.spId) {
    await spPATCH(L_ENT, ex.spId, { Hours: hours });
    H[k] = { value: hours, spId: ex.spId };
  } else {
    const r = await spPOST(L_ENT, { EmployeeEmail0: emp.email, EmployeeName: emp.name, EmpID: emp.id, EntryDate: dISO, DayOfWeek: DL[date.getDay()], Hours: hours });
    H[k] = { value: hours, spId: r.ID };
  }
}

async function submitTS(weekStart, totalHours) {
  const iso  = toISO(weekStart) + 'T00:00:00Z';
  const em   = me.email;
  const ex   = statuses[em];
  const now  = new Date().toISOString();
  const empR = emps.find(x => x.email === em);
  if (ex && ex.spItemId) {
    await spPATCH(L_TS, ex.spItemId, { Status: 'Submitted', TotalHours: totalHours, SubmittedOn: now });
    statuses[em] = { ...ex, status: 'Submitted', totalHours };
  } else {
    const r = await spPOST(L_TS, { EmployeeEmail0: em, EmployeeName: me.name, EmpID: empR?.id||'', WeekStartDate: iso, Status: 'Submitted', TotalHours: totalHours, SubmittedOn: now });
    statuses[em] = { spItemId: r.ID, status: 'Submitted', totalHours };
  }
}

/* ================================================================
   HELPERS
   ================================================================ */
function hk(ei,d){return ei+'_'+d.getFullYear()+'_'+d.getMonth()+'_'+d.getDate();}
function getH(ei,d){const v=H[hk(ei,d)];return v?(typeof v==='object'?v.value:v):0;}
function setHL(ei,d,v){const k=hk(ei,d);H[k]={value:v,spId:H[k]?.spId||null};}
function toISO(d){return d.toISOString().split('T')[0];}
function addD(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function sameD(a,b){return a.toDateString()===b.toDateString();}
function isWE(d){return d.getDay()===0||d.getDay()===6;}
function getMon(d){const x=new Date(d);const dw=x.getDay();x.setDate(x.getDate()-(dw===0?6:dw-1));x.setHours(0,0,0,0);return x;}
function getWksInMonth(y,m){const t=new Date(y,m+1,0).getDate();const wks=[];let wk=[];for(let i=1;i<=t;i++){const dt=new Date(y,m,i);wk.push(dt);if(dt.getDay()===6||i===t){wks.push(wk);wk=[];}}return wks;}
function getStatus(ei){return statuses[emps[ei]?.email]?.status||'Draft';}
function myStatus(){return statuses[me?.email]?.status||'Draft';}
function myIdx(){return emps.findIndex(e=>e.email===me?.email);}
function bCls(s){return{Draft:'bd',Submitted:'bs',Approved:'ba',Rejected:'br'}[s]||'bd';}
function bTxt(s){return{Draft:'✏ Draft',Submitted:'⏳ Submitted',Approved:'✓ Approved',Rejected:'✗ Rejected'}[s]||'✏ Draft';}
function bHTML(s){return '<span class="my-badge '+bCls(s)+'">'+bTxt(s)+'</span>';}

/* ================================================================
   VIEW CONTROL
   ================================================================ */
function setView(v){cView=v;document.getElementById('vsw-week').classList.toggle('on',v==='week');document.getElementById('vsw-month').classList.toggle('on',v==='month');loadPeriod();}
function nav(d){if(cView==='week')anchor=addD(anchor,d*7);else anchor=new Date(anchor.getFullYear(),anchor.getMonth()+d,1);loadPeriod();}
function goToday(){anchor=new Date(TODAY);loadPeriod();}
function getWO(){
  if(cView==='week'){const days=Array.from({length:7},(_,i)=>addD(getMon(anchor),i));return [{label:'Week',days,range:days[0].getDate()+'–'+days[6].getDate()+' '+MS[days[0].getMonth()]}];}
  const y=anchor.getFullYear(),m=anchor.getMonth();
  return getWksInMonth(y,m).map((wk,i)=>({label:'Week '+(i+1),days:wk,range:wk[0].getDate()+'–'+wk[wk.length-1].getDate()+' '+MS[wk[0].getMonth()]}));
}

/* ================================================================
   INIT
   ================================================================ */
async function init() {
  showLoad(true, 'Signing in...');
  try {
    // Handle any pending redirect (cleanup)
    try { await msalApp.handleRedirectPromise(); } catch(e) { console.warn('handleRedirect:', e.message); }

    const accounts = msalApp.getAllAccounts();
    console.log('[App] Accounts found:', accounts.length);

    if (!accounts.length) {
      // Not logged in — go to Microsoft login
      setMsg('Redirecting to Microsoft login...');
      console.log('[App] Opening Microsoft login popup...');
      try {
        const result = await msalApp.loginPopup({
          scopes: SCOPES,
          prompt: 'select_account'
        });
        console.log('[App] Popup login success:', result.account.username);
        // After successful popup login, reload to reinitialize
        window.location.reload();
      } catch(popupError) {
        console.error('[App] Popup login failed:', popupError.message);
        showErr('Login failed: ' + popupError.message);
        showLoad(false);
      }
      return;
    }

    // Logged in — load data
    me = await loadMe();
    document.getElementById('ua').textContent         = me.initials;
    document.getElementById('user-label').textContent = me.name + (me.isHR ? ' (HR)' : '');

    emps = await loadEmps();
    if (!emps.length) {
      showErr('No employees found. Please add employees to the Employees list in SharePoint first.');
      showLoad(false);
      return;
    }

    await loadPeriod();

  } catch(e) {
    console.error('Init error:', e);
    let msg = e.message || 'Unknown error';
    if (msg.includes('401') || msg.includes('Unauthorized')) {
      msg = '401 Unauthorized — make sure API permissions (AllSites.Read, AllSites.Write) are granted and admin consent is given in Azure AD.';
    } else if (msg.includes('403') || msg.includes('Forbidden')) {
      msg = '403 Forbidden — admin consent is missing. Ask your admin to click "Grant admin consent" in Azure AD → App registrations → Timesheet Portal → API permissions.';
    } else if (msg.includes('404') || msg.includes('not found')) {
      msg = '404 Not found — make sure the SharePoint lists (Employees, Timesheets, TimesheetEntries) exist in your site.';
    }
    showErr(msg);
    showLoad(false);
  }
}

async function loadPeriod() {
  showLoad(true, 'Loading timesheet data...');
  try {
    const wo      = getWO();
    const allDays = wo.flatMap(w => w.days);
    const ws      = getMon(allDays[0]);
    const we      = allDays[allDays.length-1];
    statuses      = await loadStatuses(ws);
    await loadEntries(ws, we);
    render();
  } catch(e) {
    console.error('Load period error:', e);
    showErr('Could not load data: ' + e.message);
  } finally {
    showLoad(false);
  }
}

/* ================================================================
   RENDER
   ================================================================ */
function render() {
  const wo=getWO(),allDays=wo.flatMap(w=>w.days);
  const mon=getMon(anchor),y=anchor.getFullYear(),m=anchor.getMonth();
  document.getElementById('range-lbl').textContent=cView==='week'
    ?MONTHS[mon.getMonth()]+' '+y+' · '+mon.getDate()+'–'+addD(mon,6).getDate()+' '+MS[mon.getMonth()]
    :MONTHS[m]+' '+y;
  const ms=myStatus();
  const b=document.getElementById('my-badge');b.className='my-badge '+bCls(ms);b.textContent=bTxt(ms);
  const sb=document.getElementById('submit-btn');
  sb.textContent={Draft:'▶ Submit',Submitted:'⏳ Submitted',Approved:'✓ Approved',Rejected:'↺ Resubmit'}[ms]||'▶ Submit';
  sb.disabled=ms==='Approved'||ms==='Submitted';
  buildFrozen();buildTable(wo,allDays);updateSum(wo,allDays);
}

function buildFrozen(){
  const mi=myIdx();
  let h='<div class="fh-top"></div><div class="fh-mid"><span class="col-n">Employee name</span><span class="col-i">Emp ID</span></div><div class="fh-date"></div>';
  emps.forEach((emp,ei)=>{const mine=ei===mi;h+='<div class="femp'+(mine?' mine':'')+'"><span class="femp-name" style="'+(mine?'color:#4f52a3;font-weight:700':'')+'">'+(mine?'▶ ':'')+emp.name+'</span><span class="femp-id">'+emp.id+'</span></div>';});
  h+='<div class="ftotal"><span class="ftotal-lbl">Column total</span></div>';
  document.getElementById('frozen-col').innerHTML=h;
}

function buildTable(wo,allDays){
  const mi=myIdx();
  let t='<table class="ts"><thead><tr>';
  wo.forEach(w=>{t+='<th class="thw" colspan="'+(w.days.length+1)+'">'+w.label+' <span>'+w.range+'</span></th>';});
  t+='<th class="thst" rowspan="3">Status</th></tr><tr>';
  wo.forEach(w=>{w.days.forEach(d=>{t+='<th class="thd'+(isWE(d)?' we':'')+'">'+DL[d.getDay()]+'</th>';});t+='<th class="thwt">Wk total</th>';});
  t+='</tr><tr>';
  wo.forEach(w=>{w.days.forEach(d=>{const isT=sameD(d,TODAY);t+='<th class="thdt'+(isWE(d)?' we':'')+(isT?' tdh':'')+'">'+d.getDate()+'</th>';});t+='<th class="thwt"></th>';});
  t+='</tr></thead><tbody>';
  emps.forEach((emp,ei)=>{
    const mine=ei===mi,st=getStatus(ei),locked=st==='Submitted'||st==='Approved';
    t+='<tr>';
    wo.forEach((w,wi)=>{
      const wt=w.days.reduce((s,d)=>s+getH(ei,d),0);
      w.days.forEach(d=>{
        const h=getH(ei,d),iW=isWE(d),isT=sameD(d,TODAY);
        t+='<td class="dc'+(iW?' we':'')+(isT?' tdc':'')+(mine?' mine':'')+'"><input type="number" min="0" max="8" step="1" value="'+(h||'')+'" '+((!mine||locked||iW)?'disabled':'')+(mine&&!locked&&!iW?' oninput="onInput('+ei+','+d.getTime()+',this)" onchange="onChanged('+ei+','+d.getTime()+',this)"':'')+'></td>';
      });
      t+='<td class="wt'+(mine?' mine':'')+'" id="wt-'+ei+'-'+wi+'">'+(wt||0)+'</td>';
    });
    t+='<td class="st">'+bHTML(st)+'</td></tr>';
  });
  t+='<tr>';
  wo.forEach((w,wi)=>{
    w.days.forEach(d=>{const ct=emps.reduce((s,_,ei)=>s+getH(ei,d),0);t+='<td class="ct'+(isWE(d)?' we':'')+'" id="ct-'+d.getTime()+'">'+(isWE(d)?'—':(ct||''))+'</td>';});
    const cwt=emps.reduce((s,_,ei)=>s+w.days.reduce((r,d)=>r+getH(ei,d),0),0);
    t+='<td class="cwt" id="cwt-'+wi+'">'+cwt+'</td>';
  });
  t+='<td class="ct"></td></tr></tbody></table>';
  document.getElementById('data-scroll').innerHTML=t;
}

function onInput(ei,ts,inp){
  const d=new Date(ts),v=Math.max(0,Math.min(8,parseFloat(inp.value)||0));
  setHL(ei,d,v);
  const wo=getWO();
  const wi=wo.findIndex(w=>w.days.some(x=>sameD(x,d)));
  if(wi>=0){const wt=wo[wi].days.reduce((s,x)=>s+getH(ei,x),0);const e=document.getElementById('wt-'+ei+'-'+wi);if(e)e.textContent=wt||0;const cwt=emps.reduce((s,_,i)=>s+wo[wi].days.reduce((r,x)=>r+getH(i,x),0),0);const ce=document.getElementById('cwt-'+wi);if(ce)ce.textContent=cwt;}
  const ct=emps.reduce((s,_,i)=>s+getH(i,d),0);const cte=document.getElementById('ct-'+d.getTime());if(cte)cte.textContent=ct||'';
  updateSum(wo,wo.flatMap(w=>w.days));
}

function onChanged(ei,ts,inp){
  const d=new Date(ts),v=Math.max(0,Math.min(8,parseFloat(inp.value)||0));
  setHL(ei,d,v);
  const k=hk(ei,d);
  if(timers[k])clearTimeout(timers[k]);
  timers[k]=setTimeout(async()=>{
    inp.style.background='#fff4ce';
    try{await saveEntry(ei,d,v);inp.style.background='#dff6dd';setTimeout(()=>{inp.style.background='';},1400);}
    catch(e){inp.style.background='#fde7e9';showToast('Could not save: '+e.message,'t-err');}
    delete timers[k];
  },800);
}

function updateSum(wo,allDays){
  const mi=myIdx();
  const mine=mi>=0?allDays.reduce((s,d)=>s+getH(mi,d),0):0;
  const team=emps.reduce((s,_,ei)=>s+allDays.reduce((r,d)=>r+getH(ei,d),0),0);
  const sub=emps.filter((_,ei)=>['Submitted','Approved'].includes(getStatus(ei))).length;
  document.getElementById('s-mine').textContent=mine+' hrs';
  document.getElementById('s-team').textContent=team+' hrs';
  document.getElementById('s-status').innerHTML=bHTML(myStatus());
  document.getElementById('s-ratio').textContent=sub+' / '+emps.length;
}

function openSubmit(){
  const wo=getWO(),allDays=wo.flatMap(w=>w.days),mi=myIdx();
  const mine=mi>=0?allDays.reduce((s,d)=>s+getH(mi,d),0):0;
  const ms=myStatus(),isR=ms==='Rejected';
  document.getElementById('modal-title').textContent=isR?'Resubmit timesheet?':'Submit your timesheet';
  document.getElementById('modal-sub').textContent=isR?'Your timesheet was rejected. Ready to resubmit to HR?':'Submit to HR for approval. HR will receive an email notification.';
  document.getElementById('modal-det').innerHTML='<div class="mdr"><span class="mdr-l">Employee</span><span class="mdr-v">'+me.name+'</span></div><div class="mdr"><span class="mdr-l">Period</span><span class="mdr-v">'+document.getElementById('range-lbl').textContent+'</span></div><div class="mdr"><span class="mdr-l">Total hours</span><span class="mdr-v" style="color:#4f52a3">'+mine+' hrs</span></div>';
  document.getElementById('modal-btns').innerHTML='<button class="mbtn mbtn-cancel" onclick="closeModal()">Cancel</button><button class="mbtn mbtn-ok" onclick="doSubmit('+mine+')">'+(isR?'↺ Resubmit to HR':'▶ Submit to HR')+'</button>';
  document.getElementById('modal-bg').classList.add('show');
}

async function doSubmit(totalHours){
  closeModal();showLoad(true,'Submitting...');
  try{await submitTS(getMon(anchor),totalHours);showToast('Submitted! HR has been notified.','t-ok');render();}
  catch(e){showToast('Could not submit: '+e.message,'t-err');}
  finally{showLoad(false);}
}

function closeModal(){document.getElementById('modal-bg').classList.remove('show');}
document.getElementById('modal-bg').addEventListener('click',function(e){if(e.target===this)closeModal();});
function showToast(msg,cls='t-ok'){const t=document.getElementById('toast');t.textContent=msg;t.className='toast '+cls+' show';setTimeout(()=>t.classList.remove('show'),4000);}
function showLoad(show,msg){document.getElementById('loader').classList.toggle('hidden',!show);if(msg)setMsg(msg);}
function setMsg(m){document.getElementById('loader-msg').textContent=m;}
function showErr(msg){document.getElementById('err-msg').textContent=msg;document.getElementById('err-banner').classList.add('show');}

// Start the app
// Wait for MSAL to be available before starting the app
function startWhenReady(attempts) {
  attempts = attempts || 0;
  if (typeof msal !== 'undefined') {
    console.log('[App] MSAL ready, initializing...');
    // NOW safe to use msal.* — initialize config and app here
    msalConfig = {
      auth: {
        clientId:    CLIENT_ID,
        authority:   'https://login.microsoftonline.com/' + TENANT_ID,
        redirectUri: REDIRECT_URI
      },
      cache: {
        cacheLocation: 'sessionStorage',
        storeAuthStateInCookie: false
      }
    };
    msalApp = new msal.PublicClientApplication(msalConfig);
    console.log('[App] msalApp created, starting init...');
    init();
    return;
  }
  if (attempts > 50) { // 5 seconds max wait
    console.error('[App] MSAL failed to load after 5 seconds');
    var msg = 'Microsoft Authentication Library failed to load. ' +
      'Please check your internet connection and refresh the page.';
    var errEl = document.getElementById('err-msg');
    var loaderEl = document.getElementById('loader');
    var bannerEl = document.getElementById('err-banner');
    if (errEl) errEl.textContent = msg;
    if (loaderEl) loaderEl.classList.add('hidden');
    if (bannerEl) bannerEl.classList.add('show');
    return;
  }
  setTimeout(function() { startWhenReady(attempts + 1); }, 100);
}

window.addEventListener('load', function() {
  console.log('[App] Page loaded, waiting for MSAL...');
  startWhenReady(0);
});
</script>
